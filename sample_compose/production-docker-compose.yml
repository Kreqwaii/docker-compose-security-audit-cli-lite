version: "3.9"

services:
  app:
    image: ghcr.io/example/app:1.4.2
    user: "1000:1000"
    read_only: true
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    ports:
      - "127.0.0.1:8080:8080"
